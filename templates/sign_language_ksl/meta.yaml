# yaml-language-server: $schema=../../schema/template_meta.schema.json

channels:
  schedule: 1276966404301652081
  events: 1276966478020612171
  introduction: 1276966523210170459
  general: 1276966561407828072
  forum: 1022659259919503420

default_timezone: Asia/Seoul

language_info:
  abbreviation: KSL
  native_localization: ko
  localized_name:
    en: Korean Sign Language
    ko: 한국 수화 언어

# Korean first, English second. Every label and every translated title in this lane is
# rendered in both, so an overseas student never has to guess.
localization:
  primary: ko
  secondary: en
  separator: " · "

# Spelled out underneath each dynamic timestamp. The dynamic timestamp already adapts to
# each viewer's own client, so this list is for screenshots, forum cross-posts and anyone
# comparing timezones at a glance - hence Korea first, then the regions KSL draws from.
display_timezones:
  - { flag: KR, timezone: Asia/Seoul }
  - { flag: JP, timezone: Asia/Tokyo }
  - { flag: US, timezone: America/Los_Angeles }
  - { flag: US, timezone: America/New_York }
  - { flag: EU, timezone: Europe/Paris }
  - { flag: AU, timezone: Australia/Sydney }
  - { flag: "🌐", timezone: UTC, label: UTC }

# 학급 체계 / Class system.
# 수업은 이 세 반 중 하나에 속합니다. events.yaml 에서는 키로만 참조하므로, 이름을 고치면
# 모든 수업에 한 번에 반영됩니다. 수업이 아닌 모임(문화 교류회 등)은 level 을 생략합니다.
levels:
  seed:
    emoji: "🌱"
    order: 1
    names:
      ko: 씨앗반 - 입문
      en: Seed Class - Introductory
  starlight:
    emoji: "⭐"
    order: 2
    names:
      ko: 별빛반 - 단어
      en: Starlight Class - Vocabulary
  moonlight:
    emoji: "🌙"
    order: 3
    names:
      ko: 달빛반 - 문장
      en: Moonlight Class - Sentences

# 운영진 직책 / Host titles.
# 진행자 이름 옆 괄호 안에 표시됩니다. events.yaml 의 role 은 이 키를 사용합니다.
roles:
  principal:
    emoji: "👑"
    order: 1
    names:
      ko: 교장선생님
      en: Principal
  homeroom_teacher:
    emoji: "🏫"
    order: 2
    names:
      ko: 담임선생님
      en: Homeroom Teacher
  student_council_president:
    emoji: "🎗️"
    order: 3
    names:
      ko: 학생회장
      en: Student Council President
  appreciation_head:
    emoji: "🎬"
    order: 4
    names:
      ko: 감상부장
      en: Appreciation Dept Head
  exploration_head:
    emoji: "🧭"
    order: 5
    names:
      ko: 탐험부장
      en: Exploration Dept Head

webhook:
  channel: schedule
  url: KSL_SCHEDULE_WEBHOOK_URL
  message_id: KSL_SCHEDULE_MESSAGE_ID

# VRChat group / world links, and the RSVP + reminder buttons, are configured here too.
# Both are left out until real values exist - see docs/examples/ for a filled-in lane and
# docs/KSL_GUIDE.md for what each block does.
