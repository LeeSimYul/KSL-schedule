# yaml-language-server: $schema=../../schema/template_events.schema.json

# ─────────────────────────────────────────────────────────────────────────────────────
#  한국수어교실(KSL) 수업 시간표 / KSL class schedule
#
#  ⚠️  이 파일의 내용은 그대로 디스코드 #schedule 채널에 게시됩니다.
#      아래 항목은 실제 값으로 바꿔 주세요:
#        - host      진행자의 실제 VRChat / 디스코드 이름
#        - basis     그 수업이 실제로 열린 날짜 (day 와 요일이 일치해야 빌드가 통과합니다)
#        - hour/minute  KST 기준 시작 시각
#        - vrchat    실제 그룹 / 인스턴스 링크
#
#  학급(level) 과 직책(role) 키는 meta.yaml 에 정의되어 있습니다.
#      level:  seed 씨앗반(입문) · starlight 별빛반(단어) · moonlight 달빛반(문장)
#      role:   principal 교장선생님 · homeroom_teacher 담임선생님
#              student_council_president 학생회장
#              appreciation_head 감상부장 · exploration_head 탐험부장
# ─────────────────────────────────────────────────────────────────────────────────────

events:
  # ── 월요일 / Monday · 씨앗반 ────────────────────────────────────────────────────────
  - host: Korea_Yujin
    name: "KSL 씨앗반"
    tags: ["class"]
    kind: class
    level: seed
    role: homeroom_teacher
    title:
      ko: 씨앗반 (입문)
      en: Seed Class (Introductory)
    description:
      ko: 지문자와 인사말부터 시작하는 입문 수업입니다. 수어를 처음 접하셔도 괜찮습니다.
      en: Fingerspelling and greetings from scratch. Absolute beginners welcome.
    platforms: ["pcvr", "quest", "desktop"]
    hand_tracking: supported
    schedule:
      basis: "2025-12-01"
      day: Monday
      hour: 5
      minute: 00
      duration: 60

  # ── 수요일 / Wednesday · 별빛반 ─────────────────────────────────────────────────────
  - host: Korea_Yujin
    name: "KSL 별빛반"
    tags: ["class", "vocabulary"]
    kind: class
    level: starlight
    role: homeroom_teacher
    title:
      ko: 별빛반 (단어)
      en: Starlight Class (Vocabulary)
    description:
      ko: 일상에서 가장 많이 쓰는 한국수어 단어를 손 모양부터 천천히 익힙니다.
      en: Everyday Korean Sign Language vocabulary, taken slowly from the handshape up.
    platforms: ["pcvr", "quest"]
    hand_tracking: recommended
    schedule:
      basis: "2025-12-03"
      day: Wednesday
      hour: 21
      minute: 0
      duration: 90

  # ── 토요일 / Saturday · 달빛반 ──────────────────────────────────────────────────────
  - host: Korea_Yujin
    name: "KSL 달빛반"
    tags: ["class", "sentences"]
    kind: class
    level: moonlight
    role: homeroom_teacher
    title:
      ko: 달빛반 (문장)
      en: Moonlight Class (Sentences)
    description:
      ko: 단어를 문장으로 잇고, 자연스러운 어순과 비수지 신호(표정)를 함께 연습합니다.
      en: Joining signs into sentences, with word order and non-manual markers.
    platforms: ["pcvr", "quest"]
    hand_tracking: recommended
    schedule:
      basis: "2025-12-06"
      day: Saturday
      hour: 21
      minute: 0
      duration: 90

  # ── 일요일 / Sunday · 자유 모임 ─────────────────────────────────────────────────────
  # 수업이 아니므로 level 을 지정하지 않습니다 - 학급 라인이 표시되지 않습니다.
  # 격주 진행(interval: 14). basis 는 실제로 진행한 주의 날짜여야 합니다.
  - host: Korea_Yujin
    name: "KSL 자유 모임"
    tags: ["social", "practice"]
    kind: social
    role: student_council_president
    title:
      ko: 자유 모임
      en: Open Practice Meetup
    description:
      ko: 배운 수어를 편하게 써 보는 자유 모임입니다. 반에 상관없이 누구나 환영합니다.
      en: A relaxed session for using what you have learned. All classes welcome.
    platforms: ["pcvr", "quest", "desktop"]
    hand_tracking: supported
    schedule:
      basis: "2025-12-07"
      day: Sunday
      hour: 21
      minute: 0
      interval: 14
      duration: 120

# ── 재충전의 날 / Recharging days ─────────────────────────────────────────────────────
# 여기 적은 날짜는 🔋 전용 임베드로 바뀌고, 그날 KSL 수업은 통합 시간표에서도 빠집니다.
# 'until' 은 끝날 포함이며, 생략하면 하루만 휴무입니다.
# 음력 공휴일(설날·추석)은 해마다 날짜가 달라지므로 매년 직접 갱신해 주세요.
closures:
  - date: "2026-10-09"
    reason:
      ko: 한글날 - 운영진 휴무
      en: Hangul Day - staff off
